<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log in - Hexovate</title>
    <!-- Tailwind CSS & FontAwesome -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>
<body class="bg-[#F5F8F1] min-h-screen flex items-center justify-center p-4">

    <!-- CENTER LOGIN CARD -->
    <div class="w-full max-w-sm bg-white border border-[#DDE8D5] rounded-2xl p-6 sm:p-8 shadow-sm">

        <!-- LOGO -->
        <a href="index.html" class="flex items-center gap-2.5">
    <div class="w-8 h-8 rounded-xl bg-[#2F5D50] text-white flex items-center justify-center shadow-sm">
        <i class="fa-solid fa-paper-plane text-xs -rotate-12"></i>
    </div>
    <span class="font-extrabold text-base tracking-tight text-[#26352D]">
        Post<span class="text-[#2F5D50]">Pilot</span>
    </span>
</a>
        <!-- HEADING -->
        <h1 class="text-2xl font-bold text-[#26352D] mb-1">Welcome back</h1>
        <p class="text-xs text-[#5C6B58] mb-6">Log in to manage your posts.</p>
        <!-- SOCIAL BUTTONS -->
        <div class="flex gap-3 mb-5">
            <button class="flex-1 flex items-center justify-center gap-2 border border-[#DDE8D5] py-2 rounded-lg text-xs font-medium text-[#26352D] hover:bg-[#F5F8F1]">
                <i class="fa-brands fa-google text-sm"></i> Google
            </button>
            <button class="flex-1 flex items-center justify-center gap-2 border border-[#DDE8D5] py-2 rounded-lg text-xs font-medium text-[#26352D] hover:bg-[#F5F8F1]">
                <i class="fa-brands fa-apple text-sm"></i> Apple
            </button>
        </div>

        <!-- DIVIDER -->
        <div class="flex items-center gap-3 mb-5">
            <div class="flex-1 h-px bg-[#DDE8D5]"></div>
            <span class="text-[10px] text-[#8B978A] uppercase">or with email</span>
            <div class="flex-1 h-px bg-[#DDE8D5]"></div>
        </div>

        <!-- EMAIL INPUT -->
        <div class="mb-4">
            <label class="block text-xs font-semibold text-[#26352D] mb-1">Email</label>
            <div class="relative">
                <i class="fa-regular fa-envelope absolute left-3 top-3 text-[#8B978A] text-xs"></i>
                <input type="email" id="email" placeholder="name@company.com" 
                       class="w-full border border-[#DDE8D5] rounded-lg py-2 pl-8 pr-3 text-xs outline-none focus:border-[#2F5D50]">
            </div>
        </div>

        <!-- PASSWORD INPUT -->
        <div class="mb-2">
            <label class="block text-xs font-semibold text-[#26352D] mb-1">Password</label>
            <div class="relative">
                <i class="fa-solid fa-lock absolute left-3 top-3 text-[#8B978A] text-xs"></i>
                <input type="password" id="password" placeholder="••••••••" 
                       class="w-full border border-[#DDE8D5] rounded-lg py-2 pl-8 pr-3 text-xs outline-none focus:border-[#2F5D50]">
            </div>
        </div>

        <!-- FORGOT PASSWORD -->
        <div class="text-right mb-5">
            <a href="#" class="text-xs text-[#2F5D50] hover:underline">Forgot password?</a>
        </div>

        <!-- LOGIN BUTTON -->
        <button id="overview" class="w-full bg-[#2F5D50] text-white py-2.5 rounded-lg text-xs font-semibold hover:bg-[#24493E] mb-4">
            Log in
        </button>

        <!-- SIGN UP LINK -->
        <p class="text-center text-xs text-[#5C6B58]">
            Don't have an account? 
            <a href="signup.html" class="text-[#2F5D50] font-bold hover:underline">Sign up</a>
        </p>

    </div>

    <script src="script.js"></script>
</body>
</html>
